spring.application.name=demo

spring.sql.init.mode=always

mybatis.configuration.map-underscore-to-camel-case=true

# 画面（JSP）の置き場所。Controller が "admin/deliveries" を返すと、/WEB-INF/jsp/admin/deliveries.jsp を表示する
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
# セッションの番号を URL（;jsessionid=...）に付けず、Cookie だけで管理する。URL から番号が漏れるのを防ぐため
server.servlet.session.tracking-modes=cookie
# 画面のフォームから送られる日付（例: 2026-11-21）を LocalDate に変換するときの形。ブラウザの日付の入力欄はこの形で送る
spring.mvc.format.date=iso

# B001 完了ステータスの月次削除バッチの実行タイミング（秒 分 時 日 月 曜日）。毎月1日 3:00
batch.delete-completed.cron=0 0 3 1 * *
